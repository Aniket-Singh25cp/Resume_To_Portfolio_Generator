<!doctype html>
<html lang="en" data-theme="{{THEME}}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{NAME}} — Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="grain" aria-hidden="true"></div>
    <div class="theme-dropdown-wrap">
      <button type="button" class="theme-toggle-btn" id="themeToggleBtn">Theme</button>
      <div class="theme-menu" id="themeMenu">
        <button type="button" class="theme-option" data-theme-option="vivid">Vivid</button>
        <button type="button" class="theme-option" data-theme-option="bold">Bold</button>
        <button type="button" class="theme-option" data-theme-option="editorial">Editorial</button>
        <button type="button" class="theme-option" data-theme-option="dark">Dark</button>
      </div>
    </div>

    <header class="site-header">
      <a class="brand" href="#home"><span class="brand-mark">{{NAME}}</span></a>
      <nav class="main-nav">{{NAV}}</nav>
      <div class="header-side">{{BADGE}}</div>
    </header>

    <main>
      <section id="home" class="hero" data-section="home">
        <div class="hero-copy">
          <h1>{{NAME}}</h1>
          <p class="hero-headline">{{HEADLINE}}</p>
          <a href="#projects" class="hero-link">Explore work ↘</a>
        </div>
        <div class="hero-visual">{{HERO_VISUAL}}</div>
      </section>
      {{SECTIONS}}
    </main>

    <script>
      (() => {
        const root = document.documentElement;

        // THE BRIDGE: Notify parent bar when theme changes
        const syncWithParent = (theme) => {
          window.parent.postMessage({ type: "THEME_UPDATE", theme: theme }, "*");
        };

        // Internal Navigation Fix
        document.addEventListener("click", (e) => {
          const link = e.target.closest('a[href^="#"]');
          if (link) {
            e.preventDefault();
            const targetId = link.getAttribute("href").slice(1);
            const el = document.getElementById(targetId);
            if (el) el.scrollIntoView({ behavior: "smooth" });
          }
        });

        // Theme Switcher
        const toggleBtn = document.getElementById("themeToggleBtn");
        const themeMenu = document.getElementById("themeMenu");
        const themeOptions = document.querySelectorAll(".theme-option");

        if (toggleBtn && themeMenu) {
          toggleBtn.onclick = (e) => { e.stopPropagation(); themeMenu.classList.toggle("is-open"); };
          document.onclick = () => themeMenu.classList.remove("is-open");

          themeOptions.forEach((opt) => {
            opt.onclick = () => {
              const theme = opt.dataset.themeOption;
              root.dataset.theme = theme;
              syncWithParent(theme);
              try { localStorage.setItem("portfolio-theme", theme); } catch (e) {}
            };
          });
        }
        
        // Initial theme sync
        syncWithParent(root.dataset.theme || 'vivid');

        // Scroll State
        const navLinks = [...document.querySelectorAll("[data-nav]")];
        const sections = [...document.querySelectorAll("section[id]")];
        window.addEventListener("scroll", () => {
            let current = 'home';
            const marker = window.scrollY + 100;
            sections.forEach(s => { if (s.offsetTop <= marker) current = s.id; });
            navLinks.forEach(l => l.classList.toggle('is-active', l.dataset.nav === current));
        }, { passive: true });
      })();
    </script>
</body>
</html>
