<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Resume Portfolio Generator</title>
  <link rel="stylesheet" href="launcher.css">
</head>
<body>
  <div id="creatorApp" class="creator-container">
    <header class="launcher-header">
      <div class="badge">AIML GLA Bootcamp '26</div>
      <h1>AI Resume to Portfolio Generator</h1>
      <p>Convert any resume text into an interactive portfolio website.</p>
    </header>

    <main class="launcher-card">
      <div class="option-grid">
        <button type="button" class="default-btn" id="useDefaultBtn">
          <strong>Use Default Resume</strong>
          <span>Generate from resume.txt</span>
        </button>
        <div class="drop-zone" id="dropZone">
          <input type="file" id="fileInput" accept=".txt" hidden>
          <p><strong>Drag & Drop .txt</strong> or click</p>
        </div>
      </div>
      <div class="divider"><span>OR PASTE TEXT</span></div>
      <textarea id="resumeInput" placeholder="Paste resume text here..."></textarea>
      <div class="actions">
        <button type="button" class="submit-btn" id="generateBtn">Generate Portfolio</button>
      </div>
      <div id="statusBox" class="status-box" hidden>
        <div class="spinner"></div>
        <span>AI is working...</span>
      </div>
      <div id="errorBox" class="error-box" hidden></div>
    </main>
  </div>

  <div id="portfolioViewer" class="portfolio-viewer" hidden>
    <div class="viewer-bar">
      <div class="viewer-left"><span class="live-indicator"></span><span>Live Portfolio</span></div>
      <button type="button" id="exitViewerBtn" class="viewer-btn">← Back to Generator</button>
    </div>
    <iframe id="portfolioFrame"></iframe>
  </div>

  <script>
    const creatorApp = document.getElementById('creatorApp');
    const portfolioViewer = document.getElementById('portfolioViewer');
    const portfolioFrame = document.getElementById('portfolioFrame');
    const generateBtn = document.getElementById('generateBtn');
    const useDefaultBtn = document.getElementById('useDefaultBtn');
    const statusBox = document.getElementById('statusBox');
    const errorBox = document.getElementById('errorBox');

    // Toggle logic
    const showViewer = (html) => {
      portfolioFrame.srcdoc = html;
      creatorApp.hidden = true;
      portfolioViewer.hidden = false;
    };

    document.getElementById('exitViewerBtn').onclick = () => {
      portfolioViewer.hidden = true;
      creatorApp.hidden = false;
      portfolioFrame.srcdoc = '';
    };

    async function startGeneration(useDefault = false) {
      errorBox.hidden = true;
      const text = document.getElementById('resumeInput').value.trim();
      
      if (!useDefault && text.length < 10) {
        errorBox.textContent = "Please paste a resume first.";
        errorBox.hidden = false;
        return;
      }

      statusBox.hidden = false;
      generateBtn.disabled = true;

      try {
        const response = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ resume_text: text, use_default: useDefault })
        });

        const data = await response.json();
        if (data.html) {
          showViewer(data.html);
        } else {
          throw new Error(data.error || "Generation failed.");
        }
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.hidden = false;
      } finally {
        statusBox.hidden = true;
        generateBtn.disabled = false;
      }
    }

    generateBtn.onclick = () => startGeneration(false);
    useDefaultBtn.onclick = () => startGeneration(true);
  </script>
</body>
</html>
