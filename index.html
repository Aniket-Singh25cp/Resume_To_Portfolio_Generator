<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Resume Portfolio Generator</title>
  <link rel="stylesheet" href="launcher.css">
</head>
<body>
  <div id="creatorApp" class="creator-container">
    <header class="launcher-header">
      <div class="badge">AIML GLA Bootcamp '26</div>
      <h1>AI Resume to Portfolio Generator</h1>
    </header>

    <main class="launcher-card">
      <div class="mode-selector">
        <button type="button" class="mode-btn active" id="modePaste">Paste Resume Text</button>
        <button type="button" class="mode-btn" id="modeDefault">Use Default (resume.txt)</button>
      </div>

      <div id="pasteSection">
        <textarea id="resumeInput" placeholder="Paste your resume text here..."></textarea>
      </div>
      
      <div id="defaultSection" hidden>
        <div class="info-alert">System will use the 'resume.txt' file located in the root directory.</div>
      </div>

      <div class="actions">
        <button type="button" class="submit-btn" id="generateBtn">Generate Portfolio</button>
      </div>

      <div id="statusBox" class="status-box" hidden>
        <div class="spinner"></div>
        <span>AI is processing your request...</span>
      </div>
      <div id="errorBox" class="error-box" hidden></div>
    </main>
  </div>

  <div id="portfolioViewer" class="portfolio-viewer" hidden>
    <div class="viewer-bar">
      <div class="viewer-left"><span class="live-indicator"></span><span>Live Portfolio</span></div>
      <button type="button" id="exitViewerBtn" class="viewer-btn">← Back to Generator</button>
    </div>
    <iframe id="portfolioFrame"></iframe>
  </div>

  <script>
    let useDefaultMode = false;

    const btnPaste = document.getElementById('modePaste');
    const btnDefault = document.getElementById('modeDefault');
    const pasteSection = document.getElementById('pasteSection');
    const defaultSection = document.getElementById('defaultSection');
    const generateBtn = document.getElementById('generateBtn');
    const statusBox = document.getElementById('statusBox');
    const errorBox = document.getElementById('errorBox');

    // Switch to Paste Mode
    btnPaste.onclick = () => {
      useDefaultMode = false;
      btnPaste.classList.add('active');
      btnDefault.classList.remove('active');
      pasteSection.hidden = false;
      defaultSection.hidden = true;
    };

    // Switch to Default Mode
    btnDefault.onclick = () => {
      useDefaultMode = true;
      btnDefault.classList.add('active');
      btnPaste.classList.remove('active');
      pasteSection.hidden = true;
      defaultSection.hidden = false;
    };

    document.getElementById('exitViewerBtn').onclick = () => {
      document.getElementById('portfolioViewer').hidden = true;
      document.getElementById('creatorApp').hidden = false;
    };

    async function generate() {
      errorBox.hidden = true;
      const text = document.getElementById('resumeInput').value.trim();
      
      if (!useDefaultMode && text.length < 10) {
        errorBox.textContent = "Please paste resume text first.";
        errorBox.hidden = false;
        return;
      }

      statusBox.hidden = false;
      generateBtn.disabled = true;

      try {
        const response = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ resume_text: text, use_default: useDefaultMode })
        });

        const data = await response.json();
        if (data.html) {
          document.getElementById('portfolioFrame').srcdoc = data.html;
          document.getElementById('creatorApp').hidden = true;
          document.getElementById('portfolioViewer').hidden = false;
        } else {
          throw new Error(data.error || "Generation failed.");
        }
      } catch (err) {
        errorBox.textContent = "Error: " + err.message;
        errorBox.hidden = false;
      } finally {
        statusBox.hidden = true;
        generateBtn.disabled = false;
      }
    }

    generateBtn.onclick = generate;
  </script>
</body>
</html>
