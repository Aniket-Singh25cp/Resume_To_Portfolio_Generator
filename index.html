<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Portfolio Generator</title>
  <link rel="stylesheet" href="launcher.css">
</head>
<body>
  <!-- Landing Page -->
  <div id="creatorApp" class="creator-container">
    <header class="launcher-header">
      <div class="badge">Bootcamp Project '26</div>
      <h1>AI Resume to Portfolio</h1>
      <p>Landing page to generate your instant portfolio.</p>
    </header>

    <main class="launcher-card">
      <div class="option-grid">
        <button id="useDefaultBtn" class="default-btn">Use Default Resume</button>
        <div class="drop-zone">Drag & Drop .txt here</div>
      </div>
      <textarea id="resumeInput" placeholder="Paste resume text here..."></textarea>
      <button id="generateBtn" class="submit-btn">Generate Portfolio</button>
      <div id="statusBox" class="status-box" hidden>AI is working...</div>
    </main>
  </div>

  <!-- Hidden Portfolio Preview -->
  <div id="portfolioViewer" class="portfolio-viewer" hidden>
  <div class="viewer-bar">
    <div class="viewer-left">
      <span class="live-indicator"></span>
      <span class="viewer-title">Live Portfolio</span> <!-- Changed here -->
    </div>
    <div class="viewer-actions">
      <button type="button" id="exitViewerBtn" class="viewer-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        <span>Back to Generator</span>
      </button>
    </div>
  </div>
  <iframe id="portfolioFrame" title="Live Preview"></iframe>
</div>

  <!-- Replace your current script in template.html with this -->
<script>
    (() => {
      const root = document.documentElement;
      
      // Theme Toggle Logic
      const toggleBtn = document.getElementById('themeToggleBtn');
      const themeMenu = document.getElementById('themeMenu');
      const themeOptions = document.querySelectorAll('[data-theme-option]');

      if (toggleBtn && themeMenu) {
          toggleBtn.addEventListener('click', (e) => {
              e.stopPropagation();
              const isOpen = themeMenu.classList.contains('is-open');
              themeMenu.classList.toggle('is-open', !isOpen);
              toggleBtn.setAttribute('aria-expanded', !isOpen);
          });

          document.addEventListener('click', () => {
              themeMenu.classList.remove('is-open');
              toggleBtn.setAttribute('aria-expanded', 'false');
          });

          themeOptions.forEach(opt => {
              opt.addEventListener('click', () => {
                  const theme = opt.dataset.themeOption;
                  root.dataset.theme = theme;
                  localStorage.setItem('portfolio-theme', theme);
              });
          });
      }

      // Smooth Nav
      const navLinks = [...document.querySelectorAll('[data-nav]')];
      const sections = [...document.querySelectorAll('[data-section]')];
      window.addEventListener('scroll', () => {
          const marker = window.scrollY + 100;
          let current = 'home';
          sections.forEach(s => { if (s.offsetTop <= marker) current = s.id; });
          navLinks.forEach(l => l.classList.toggle('is-active', l.dataset.nav === current));
      }, { passive: true });
    })();
</script>
</body>
</html>
