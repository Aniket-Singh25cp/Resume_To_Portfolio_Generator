<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Portfolio Generator</title>
  <link rel="stylesheet" href="launcher.css">
</head>
<body>
  <!-- Landing Page -->
  <div id="creatorApp" class="creator-container">
    <header class="launcher-header">
      <div class="badge">Bootcamp Project '26</div>
      <h1>AI Resume to Portfolio</h1>
      <p>Landing page to generate your instant portfolio.</p>
    </header>

    <main class="launcher-card">
      <div class="option-grid">
        <button id="useDefaultBtn" class="default-btn">Use Default Resume</button>
        <div class="drop-zone">Drag & Drop .txt here</div>
      </div>
      <textarea id="resumeInput" placeholder="Paste resume text here..."></textarea>
      <button id="generateBtn" class="submit-btn">Generate Portfolio</button>
      <div id="statusBox" class="status-box" hidden>AI is working...</div>
    </main>
  </div>

  <!-- Hidden Portfolio Preview -->
  <div id="portfolioViewer" class="portfolio-viewer" hidden>
    <div class="viewer-bar">
      <span>Live Preview</span>
      <button id="exitViewerBtn" class="viewer-btn">← Back to Generator</button>
    </div>
    <iframe id="portfolioFrame"></iframe>
  </div>

  <script>
    const creatorApp = document.getElementById('creatorApp');
    const portfolioViewer = document.getElementById('portfolioViewer');
    const portfolioFrame = document.getElementById('portfolioFrame');
    const exitViewerBtn = document.getElementById('exitViewerBtn');
    const generateBtn = document.getElementById('generateBtn');

    // FIX: BACK TO GENERATOR
    exitViewerBtn.addEventListener('click', () => {
      portfolioViewer.hidden = true;
      creatorApp.hidden = false;
      portfolioFrame.srcdoc = '';
    });

    async function handleGenerate(useDefault = false) {
      const statusBox = document.getElementById('statusBox');
      statusBox.hidden = false;
      generateBtn.disabled = true;

      try {
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            use_default: useDefault,
            resume_text: document.getElementById('resumeInput').value
          })
        });
        const data = await res.json();
        if (data.html) {
          creatorApp.hidden = true;
          portfolioViewer.hidden = false;
          portfolioFrame.srcdoc = data.html;
        } else {
          alert(data.error);
        }
      } catch (e) {
        alert("Failed to connect to API");
      } finally {
        statusBox.hidden = true;
        generateBtn.disabled = false;
      }
    }

    generateBtn.addEventListener('click', () => handleGenerate(false));
    document.getElementById('useDefaultBtn').addEventListener('click', () => handleGenerate(true));
  </script>
</body>
</html>
